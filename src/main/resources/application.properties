spring.application.name=qr-checkin

# H2 in-memory database - zero setup, resets on restart. Great for a demo/portfolio
# project. Swap to PostgreSQL later by changing these 4 lines + the driver dependency.
spring.datasource.url=jdbc:h2:mem:qrcheckin;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Browse the DB at http://localhost:8080/h2-console (JDBC URL above, blank password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
